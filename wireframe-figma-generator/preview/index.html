<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframe Preview – Sistem Pengadaan Material Kapal PT PAL</title>
<meta name="description" content="Low-fidelity wireframe preview untuk Sistem Informasi Pengadaan Material Kapal PT PAL Indonesia. Menampilkan 43 halaman dari 5 role pengguna." />
<style>
  :root {
    --bg: #f8fafc;
    --sidebar-bg: #0f172a;
    --sidebar-w: 260px;
    --border: #e2e8f0;
    --gray50: #f8fafc;
    --gray100: #f1f5f9;
    --gray200: #e2e8f0;
    --gray300: #cbd5e1;
    --gray400: #94a3b8;
    --gray500: #64748b;
    --gray700: #334155;
    --gray900: #0f172a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); display: flex; min-height: 100vh; color: var(--gray900); }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--sidebar-bg);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100;
  }
  .sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid #1e293b; }
  .sidebar-logo { font-size: 15px; font-weight: 700; color: #fff; }
  .sidebar-sub { font-size: 10px; color: #64748b; margin-top: 4px; }
  .sidebar-filter { padding: 12px 16px; border-bottom: 1px solid #1e293b; }
  .sidebar-filter label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #475569; display: block; margin-bottom: 6px; letter-spacing: 0.06em; }
  .sidebar-filter select { width: 100%; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  .sidebar-search { padding: 10px 16px; border-bottom: 1px solid #1e293b; }
  .sidebar-search input { width: 100%; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  .sidebar-search input::placeholder { color: #475569; }
  .sidebar-nav { flex: 1; padding: 8px 0; }
  .nav-role { padding: 10px 16px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #475569; }
  .nav-link {
    display: block; padding: 7px 16px 7px 24px; font-size: 12px; color: #94a3b8;
    text-decoration: none; cursor: pointer; transition: background 0.1s, color 0.1s;
    border-left: 2px solid transparent;
  }
  .nav-link:hover { background: #1e293b; color: #e2e8f0; }
  .nav-link.active { background: #1e293b; color: #fff; border-left-color: #fff; font-weight: 600; }
  .sidebar-counter { padding: 12px 16px; border-top: 1px solid #1e293b; font-size: 11px; color: #475569; }

  /* MAIN */
  #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
  #topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 32px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; gap: 16px; }
  .topbar-breadcrumb { font-size: 13px; color: var(--gray500); }
  .topbar-breadcrumb span { font-weight: 700; color: var(--gray900); }
  .topbar-badge { background: var(--gray100); color: var(--gray700); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .topbar-route { font-size: 11px; color: var(--gray400); font-family: monospace; }
  #canvas { padding: 32px; }

  /* WIREFRAME FRAME */
  .wf-frame {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    width: 1440px; min-height: 900px; transform-origin: top left;
    box-shadow: 0 4px 40px rgba(0,0,0,0.07); overflow: hidden;
    margin-bottom: 40px;
  }

  /* NAVBAR */
  .wf-navbar { display: flex; align-items: center; gap: 0; padding: 0 32px; height: 60px; background: #fff; border-bottom: 1px solid var(--border); }
  .wf-nav-logo { background: var(--gray200); border-radius: 6px; padding: 6px 16px; font-size: 12px; font-weight: 700; color: var(--gray700); margin-right: 32px; }
  .wf-nav-item { padding: 0 16px; font-size: 13px; color: var(--gray700); font-weight: 500; cursor: pointer; height: 60px; display: flex; align-items: center; border-bottom: 2px solid transparent; }
  .wf-nav-item:first-of-type { border-bottom-color: var(--gray900); color: var(--gray900); font-weight: 700; }
  .wf-nav-avatar { margin-left: auto; background: var(--gray300); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--gray700); }

  /* HEADER */
  .wf-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); background: #fff; }
  .wf-header-title { font-size: 20px; font-weight: 700; color: var(--gray900); }
  .wf-header-sub { font-size: 12px; color: var(--gray500); margin-top: 4px; max-width: 600px; }

  /* CONTENT */
  .wf-content { padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; }

  /* BUTTONS */
  .wf-btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 20px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .wf-btn-primary { background: var(--gray900); color: #fff; }
  .wf-btn-secondary { background: var(--gray100); color: var(--gray700); }
  .wf-btn-danger { background: var(--gray700); color: #fff; }
  .wf-btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .wf-btn-full { width: 100%; }

  /* HERO */
  .wf-hero { background: var(--gray900); border-radius: 16px; padding: 32px; color: #fff; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .wf-hero-body { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .wf-hero-tag { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 14px; font-size: 11px; color: #94a3b8; display: inline-block; width: fit-content; }
  .wf-hero-title { font-size: 26px; font-weight: 700; line-height: 1.3; max-width: 700px; }
  .wf-hero-stat { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 16px 20px; min-width: 180px; }
  .wf-stat-lbl { font-size: 11px; color: #94a3b8; }
  .wf-stat-val { font-size: 28px; font-weight: 700; color: #fff; margin-top: 4px; }

  /* BRANDING */
  .wf-branding { background: var(--gray900); padding: 40px; color: #fff; border-radius: 0; width: 50%; min-height: 900px; display: flex; flex-direction: column; gap: 16px; }
  .wf-brand-logo { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 16px; font-size: 12px; color: #94a3b8; width: fit-content; }
  .wf-brand-title { font-size: 28px; font-weight: 700; }
  .wf-brand-sub { font-size: 13px; color: #94a3b8; }
  .wf-brand-stats { display: flex; gap: 16px; margin-top: 16px; }
  .wf-brand-stat { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 16px; min-width: 120px; }
  .wf-brand-val { font-size: 24px; font-weight: 700; }
  .wf-brand-lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }

  /* STEP CARDS */
  .wf-step-row { display: flex; gap: 16px; }
  .wf-step-card { flex: 1; background: var(--gray50); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .wf-step-num { font-size: 24px; font-weight: 700; color: var(--gray300); }
  .wf-step-lbl { font-size: 12px; font-weight: 600; color: var(--gray700); margin-top: 8px; }

  /* MENU CARDS */
  .wf-menu-grid { display: grid; gap: 16px; }
  .wf-menu-card { background: var(--gray50); border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
  .wf-menu-span { grid-column: 1 / -1; }
  .wf-menu-num { font-size: 18px; font-weight: 700; color: var(--gray300); }
  .wf-menu-tag { background: var(--gray100); border-radius: 6px; padding: 2px 10px; font-size: 10px; color: var(--gray500); width: fit-content; }
  .wf-menu-title { font-size: 16px; font-weight: 700; color: var(--gray900); }
  .wf-menu-desc { font-size: 12px; color: var(--gray500); }
  .wf-menu-cta { font-size: 12px; font-weight: 600; color: var(--gray700); margin-top: 8px; }

  /* INFO CARDS */
  .wf-info-row { display: flex; gap: 16px; }
  .wf-info-card { flex: 1; background: var(--gray50); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .wf-info-num { font-size: 20px; font-weight: 700; color: var(--gray300); }
  .wf-info-title { font-size: 14px; font-weight: 700; color: var(--gray900); margin-top: 8px; }
  .wf-info-desc { font-size: 11px; color: var(--gray500); margin-top: 6px; }

  /* SHORTCUT */
  .wf-shortcut { background: var(--gray50); border: 1px solid var(--border); border-radius: 12px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }

  /* FILTER BAR */
  .wf-filter-bar { background: var(--gray50); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .wf-filter-select { background: var(--gray100); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--gray500); cursor: pointer; }

  /* TABLE */
  .wf-tbl-title { font-size: 14px; font-weight: 700; color: var(--gray900); margin-bottom: 8px; }
  .wf-table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .wf-table { width: 100%; border-collapse: collapse; }
  .wf-table thead { background: var(--gray50); }
  .wf-table th { padding: 12px 16px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gray500); border-bottom: 1px solid var(--border); }
  .wf-table td { padding: 12px 16px; font-size: 12px; color: var(--gray700); border-bottom: 1px solid var(--gray50); }
  .wf-table tbody tr:last-child td { border-bottom: none; }
  .wf-badge { background: var(--gray200); color: var(--gray700); border-radius: 20px; padding: 3px 12px; font-size: 10px; font-weight: 600; white-space: nowrap; }
  .wf-action-btn { background: var(--gray900); color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 10px; font-weight: 600; margin-right: 4px; cursor: pointer; white-space: nowrap; display: inline-block; }

  /* FORM */
  .wf-form-title { font-size: 14px; font-weight: 700; color: var(--gray900); margin-bottom: 12px; }
  .wf-form { display: flex; flex-direction: column; gap: 14px; }
  .wf-field { display: flex; flex-direction: column; gap: 6px; }
  .wf-label { font-size: 12px; font-weight: 600; color: var(--gray700); }
  .wf-input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--gray700); width: 100%; background: #fff; }
  .wf-textarea { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--gray700); width: 100%; background: #fff; height: 72px; resize: none; }
  .wf-select-box { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: var(--gray400); background: #fff; width: 100%; cursor: pointer; }
  .wf-upload { border: 1px dashed var(--border); border-radius: 8px; padding: 16px; font-size: 12px; color: var(--gray400); background: var(--gray50); cursor: pointer; text-align: center; }
  .wf-checkbox-group { font-size: 12px; color: var(--gray500); padding: 8px 12px; background: var(--gray50); border-radius: 8px; }
  .wf-table-input { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 12px; color: var(--gray400); background: var(--gray50); }

  /* CHAT */
  .wf-chat { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .wf-chat-header { background: var(--gray50); padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--gray900); border-bottom: 1px solid var(--border); }
  .wf-chat-body { background: #fff; padding: 16px; min-height: 160px; display: flex; flex-direction: column; gap: 12px; }
  .wf-empty-chat { font-size: 12px; color: var(--gray400); text-align: center; padding: 32px; }
  .wf-bubble { max-width: 60%; display: flex; flex-direction: column; gap: 4px; }
  .wf-bubble-left { align-self: flex-start; }
  .wf-bubble-right { align-self: flex-end; }
  .wf-bubble-sender { font-size: 10px; color: var(--gray400); font-weight: 600; }
  .wf-bubble-left .wf-bubble-text { background: var(--gray100); color: var(--gray900); border-radius: 0 10px 10px 10px; padding: 8px 12px; font-size: 12px; }
  .wf-bubble-right .wf-bubble-text { background: var(--gray900); color: #fff; border-radius: 10px 0 10px 10px; padding: 8px 12px; font-size: 12px; }
  .wf-chat-input { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--gray50); }

  /* DETAIL */
  .wf-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; background: var(--gray50); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .wf-detail-row { display: flex; gap: 8px; font-size: 12px; }
  .wf-detail-key { color: var(--gray500); font-weight: 600; white-space: nowrap; }
  .wf-detail-val { color: var(--gray900); }

  /* UPLOAD / IMG */
  .wf-img-placeholder { background: var(--gray200); border-radius: 10px; width: 200px; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--gray400); font-weight: 600; }
  .wf-img-small { width: 160px; height: 120px; }
  .wf-gallery { display: flex; gap: 12px; flex-wrap: wrap; }

  /* TIMELINE */
  .wf-timeline { display: flex; align-items: flex-start; gap: 0; }
  .wf-tl-item { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
  .wf-tl-item:not(:last-child)::after { content: ""; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px; background: var(--gray300); }
  .wf-tl-circle { width: 30px; height: 30px; border-radius: 50%; background: var(--gray900); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; z-index: 1; }
  .wf-tl-label { font-size: 10px; color: var(--gray700); margin-top: 8px; text-align: center; max-width: 80px; }

  /* WORKFLOW */
  .wf-workflow { background: var(--gray50); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .wf-workflow-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .wf-ws-step { font-size: 12px; color: var(--gray700); }
  .wf-ws-arrow { font-size: 12px; color: var(--gray300); }

  /* LEGEND */
  .wf-legend { background: var(--gray50); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .wf-legend-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* QUICK ACCESS */
  .wf-quick-access { background: var(--gray100); border-radius: 10px; padding: 14px 16px; }
  .wf-quick-access > strong { font-size: 12px; color: var(--gray700); display: block; margin-bottom: 10px; }

  /* REPORT HEADER */
  .wf-report-header { background: var(--gray50); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .wf-report-title { font-size: 16px; font-weight: 700; color: var(--gray900); margin-bottom: 12px; }

  /* STAT ROW */
  .wf-stat-row { display: flex; gap: 16px; }
  .wf-stat-card { flex: 1; background: var(--gray50); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .wf-stat-card .wf-stat-val { font-size: 22px; font-weight: 700; color: var(--gray900); }
  .wf-stat-card .wf-stat-lbl { font-size: 11px; color: var(--gray500); margin-top: 4px; }
  .wf-stat-card .wf-stat-sub { font-size: 10px; color: var(--gray400); margin-top: 2px; }

  /* PAGINATION */
  .wf-pagination { background: var(--gray50); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 12px; color: var(--gray500); text-align: center; }

  /* CHECKBOX */
  .wf-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray700); }

  /* LINK */
  .wf-link { font-size: 12px; color: var(--gray500); text-decoration: underline; cursor: pointer; }

  /* SECTION TITLE */
  .wf-section-title { font-size: 17px; font-weight: 700; color: var(--gray900); }

  /* NOTE */
  .wf-note { background: #fef3c7; border: 1px solid #fbbf24; color: #92400e; border-radius: 8px; padding: 8px 12px; font-size: 11px; }
  .wf-unknown { background: var(--gray100); border-radius: 6px; padding: 8px 12px; font-size: 11px; color: var(--gray400); font-family: monospace; }

  /* FLOW */
  .wf-flows { background: var(--gray50); border-top: 1px solid var(--border); padding: 16px 32px; display: flex; flex-direction: column; gap: 6px; }
  .wf-flows strong { font-size: 11px; font-weight: 700; color: var(--gray500); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; display: block; }
  .wf-flow-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .wf-flow-src { background: var(--gray900); color: #fff; border-radius: 4px; padding: 2px 8px; font-family: monospace; }
  .wf-flow-arrow { color: var(--gray400); }
  .wf-flow-dst { background: var(--gray200); color: var(--gray700); border-radius: 4px; padding: 2px 8px; font-family: monospace; }

  /* ZOOM */
  #canvas-inner { transform-origin: top left; }

  /* TOOLBAR */
  #toolbar { background: var(--gray50); border-bottom: 1px solid var(--border); padding: 8px 32px; display: flex; align-items: center; gap: 12px; }
  .toolbar-label { font-size: 11px; color: var(--gray500); font-weight: 600; }
  .toolbar-btn { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--gray700); }
  .toolbar-btn:hover { background: var(--gray100); }
  #zoom-display { font-size: 12px; color: var(--gray700); font-weight: 600; min-width: 48px; text-align: center; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">🚢 PT PAL Wireframe</div>
    <div class="sidebar-sub">Sistem Pengadaan Material Kapal</div>
  </div>
  <div class="sidebar-filter">
    <label>Filter Role</label>
    <select id="role-select" onchange="filterByRole(this.value)">
      <option value="all">Semua Role</option>
      <option value="Engineer">Engineer</option>
      <option value="Planner">Planner</option>
      <option value="Supply Chain">Supply Chain</option>
      <option value="Vendor">Vendor</option>
      <option value="Gudang">Gudang</option>
      <option value="all-public">All / Public</option>
    </select>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search-input" placeholder="🔍 Cari halaman..." oninput="filterBySearch(this.value)" />
  </div>
  <div class="sidebar-nav" id="sidebar-nav"></div>
  <div class="sidebar-counter" id="sidebar-counter">43 halaman</div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div class="topbar-breadcrumb">Wireframe Preview &rsaquo; <span id="tb-name">Dashboard Engineer</span></div>
    <div class="topbar-badge" id="tb-role">Engineer</div>
    <div class="topbar-route" id="tb-route">/engineer/dashboard</div>
  </div>
  <div id="toolbar">
    <span class="toolbar-label">Zoom:</span>
    <button class="toolbar-btn" onclick="adjustZoom(-10)">－</button>
    <span id="zoom-display">50%</span>
    <button class="toolbar-btn" onclick="adjustZoom(10)">＋</button>
    <button class="toolbar-btn" onclick="setZoom(50)">50%</button>
    <button class="toolbar-btn" onclick="setZoom(75)">75%</button>
    <button class="toolbar-btn" onclick="setZoom(100)">100%</button>
    <button class="toolbar-btn" onclick="setZoom(33)">Fit</button>
  </div>
  <div id="canvas">
    <div id="canvas-inner">
      <div class="wf-frame" id="wf-frame"></div>
    </div>
  </div>

let zoom = 50;

function renderSidebar(filter = 'all', search = '') {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  const roles = {};
  PAGES.forEach(p => {
    const r = p.role;
    if (!roles[r]) roles[r] = [];
    roles[r].push(p);
  });
  let total = 0;
  Object.entries(roles).forEach(([role, ps]) => {
    if (filter !== 'all' && filter !== 'all-public') {
      if (role !== filter && role !== 'all' && role !== 'public') return;
    }
    const filtered = ps.filter(p => !search || p.name.toLowerCase().includes(search.toLowerCase()));
    if (filtered.length === 0) return;
    const roleDiv = document.createElement('div');
    roleDiv.className = 'nav-role';
    roleDiv.textContent = role;
    nav.appendChild(roleDiv);
    filtered.forEach(p => {
      total++;
      const a = document.createElement('a');
      a.className = 'nav-link';
      a.textContent = p.name;
      a.href = '#';
      a.onclick = (e) => { e.preventDefault(); showPage(p.id); };
      a.id = `nav-${p.id}`;
      nav.appendChild(a);
    });
  });
  document.getElementById('sidebar-counter').textContent = total + ' halaman';
}

function filterByRole(role) { renderSidebar(role, document.getElementById('search-input').value); }
function filterBySearch(q) { renderSidebar(document.getElementById('role-select').value, q); }

function showPage(id) {
  const page = PAGES.find(p => p.id === id);
  if (!page) return;
  document.getElementById('wf-frame').innerHTML = page.html;
  document.getElementById('tb-name').textContent = page.name;
  document.getElementById('tb-role').textContent = page.role;
  document.getElementById('tb-route').textContent = PAGES.find(p => p.id === id)?.route || '';
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.id === `nav-${id}`));
}

function adjustZoom(delta) { setZoom(zoom + delta); }
function setZoom(z) {
  zoom = Math.max(10, Math.min(z, 150));
  document.getElementById('canvas-inner').style.transform = `scale(${zoom/100})`;
  document.getElementById('zoom-display').textContent = zoom + '%';
  // Adjust canvas height to account for scaled content
  const frame = document.getElementById('wf-frame');
  document.getElementById('canvas').style.minHeight = (frame ? frame.offsetHeight * zoom / 100 + 64 : 500) + 'px';
}

renderSidebar();
showPage(PAGES[0].id);
setZoom(50);
</script>
